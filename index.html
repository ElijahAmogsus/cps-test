<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🖱️ CPS Test | ElijahAmogsus</title>
  <style>
    :root {
      --base: #1e1e2e; --mantle: #181825; --surface0: #313244;
      --surface1: #45475a; --text: #cdd6f4; --subtext0: #a6adc8;
      --accent: #89b4fa;
    }

    * { box-sizing: border-box; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }

    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      background-color: var(--base); color: var(--text); font-family: monospace;
    }

    body { display: flex; flex-direction: column; align-items: center; padding: 30px 16px; }

    .back-link { color: var(--accent); text-decoration: none; font-weight: bold; margin-top: 24px; display: inline-block; }
    .back-link:hover { text-decoration: underline; }

    .theme-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; align-items: center; }

    .theme-btn, .accent-select, .mode-btn {
      background-color: var(--mantle); color: var(--text); border: 2px solid var(--surface1);
      border-radius: 6px; padding: 6px 12px; font-family: monospace; font-weight: bold; cursor: pointer;
    }

    .theme-btn:hover, .theme-btn.active, .accent-select:hover, .accent-select:focus, .mode-btn:hover, .mode-btn.active {
      border-color: var(--accent); background-color: var(--surface0); outline: none;
    }

    h1 { color: var(--accent); margin: 0 0 8px 0; font-size: clamp(1.5rem, 6vw, 2rem); text-align: center; }
    p { color: var(--subtext0); margin: 0 0 24px 0; text-align: center; }

    .box { width: 100%; max-width: 720px; background-color: var(--mantle); border: 2px solid var(--surface1); border-radius: 10px; padding: 20px; }

    .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .stat { background-color: var(--base); border: 2px solid var(--surface1); border-radius: 8px; padding: 12px; text-align: center; }
    .stat span { display: block; color: var(--subtext0); font-size: 0.85rem; margin-bottom: 4px; }
    .stat strong { color: var(--accent); font-size: 1.35rem; }

    .click-pad {
      width: 100%; height: 220px; background-color: var(--base); border: 2px dashed var(--accent);
      border-radius: 10px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; cursor: pointer; user-select: none; text-align: center; padding: 16px;
    }
    .click-pad:active { background-color: var(--surface0); transform: scale(0.99); }
    .click-pad strong { font-size: 1.3rem; color: var(--accent); }
    .click-pad span { color: var(--subtext0); font-size: 0.9rem; margin-top: 8px; }

    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn {
      flex: 1; padding: 10px 14px; border: 2px solid var(--accent); border-radius: 6px;
      background-color: var(--accent); color: var(--base); font-family: monospace;
      font-weight: bold; font-size: 0.95rem; cursor: pointer;
    }
    .btn.secondary { background-color: var(--base); color: var(--text); border-color: var(--surface1); }
    .btn.secondary:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('mocha')">🌿 Mocha</button>
    <button class="theme-btn" onclick="setTheme('macchiato')">🌺 Macchiato</button>
    <button class="theme-btn" onclick="setTheme('frappe')">🪴 Frappé</button>
    <button class="theme-btn" onclick="setTheme('latte')">🌻 Latte</button>
    <select id="accentSelect" class="accent-select" onchange="setAccent(this.value)" aria-label="Accent Color">
      <option value="rosewater">🌸 Rosewater</option>
      <option value="flamingo">🦩 Flamingo</option>
      <option value="pink">💖 Pink</option>
      <option value="mauve">🔮 Mauve</option>
      <option value="red">🍎 Red</option>
      <option value="maroon">🍒 Maroon</option>
      <option value="peach">🍑 Peach</option>
      <option value="yellow">🍋 Yellow</option>
      <option value="green">🍏 Green</option>
      <option value="teal">🌊 Teal</option>
      <option value="sky">☁️ Sky</option>
      <option value="sapphire">💎 Sapphire</option>
      <option value="blue" selected>💙 Blue</option>
      <option value="lavender">🪻 Lavender</option>
    </select>
  </div>

  <h1>🖱️ CPS Test</h1>
  <p>Measure your clicks per second & beat your personal record</p>

  <div class="box">
    <div class="modes">
      <button class="mode-btn" onclick="setDuration(1, this)">1s</button>
      <button class="mode-btn active" onclick="setDuration(5, this)">5s</button>
      <button class="mode-btn" onclick="setDuration(10, this)">10s</button>
      <button class="mode-btn" onclick="setDuration(30, this)">30s</button>
    </div>

    <div class="stats">
      <div class="stat"><span>Time Left</span><strong id="timeDisplay">5.0s</strong></div>
      <div class="stat"><span>Clicks</span><strong id="clicksDisplay">0</strong></div>
      <div class="stat"><span>Current CPS</span><strong id="cpsDisplay">0.00</strong></div>
      <div class="stat"><span>Best CPS</span><strong id="bestDisplay">0.00</strong></div>
    </div>

    <div class="click-pad" id="clickPad">
      <strong id="padTitle">CLICK HERE TO START</strong>
      <span id="padSub">Timer starts on your very first click</span>
    </div>

    <div class="actions">
      <button class="btn secondary" onclick="resetTest()">Reset Test</button>
      <button class="btn secondary" onclick="clearBest()">Clear Best</button>
    </div>
  </div>

  <a href="/" class="back-link">← Back to Dev Hub</a>
  <script>
    const themes = {
      mocha: {
        base: '#1e1e2e', mantle: '#181825', surface0: '#313244', surface1: '#45475a', text: '#cdd6f4', subtext0: '#a6adc8',
        accents: { rosewater: '#f5e0dc', flamingo: '#f2cdcd', pink: '#f5c2e7', mauve: '#cba6f7', red: '#f38ba8', maroon: '#eba0ac', peach: '#fab387', yellow: '#f9e2af', green: '#a6e3a1', teal: '#94e2d5', sky: '#89dceb', sapphire: '#74c7ec', blue: '#89b4fa', lavender: '#b4befe' }
      },
      macchiato: {
        base: '#24273a', mantle: '#1e2030', surface0: '#363a4f', surface1: '#494d64', text: '#cad3f5', subtext0: '#a5adcb',
        accents: { rosewater: '#f4dbd6', flamingo: '#f0c6c6', pink: '#f5bde6', mauve: '#c6a0f6', red: '#ed8796', maroon: '#ee99a0', peach: '#f5a97f', yellow: '#eed49f', green: '#a6da95', teal: '#8bd5ca', sky: '#91d7e3', sapphire: '#7dc4e4', blue: '#8aadf4', lavender: '#b7bdf8' }
      },
      frappe: {
        base: '#303446', mantle: '#292c3c', surface0: '#414559', surface1: '#51576d', text: '#c6d0f5', subtext0: '#a5adce',
        accents: { rosewater: '#f2d5cf', flamingo: '#eebebe', pink: '#f4b8e4', mauve: '#ca9ee6', red: '#e78284', maroon: '#ea999c', peach: '#ef9f76', yellow: '#e5c890', green: '#a6d189', teal: '#81c8be', sky: '#99d1db', sapphire: '#85c1dc', blue: '#8caaee', lavender: '#babbf1' }
      },
      latte: {
        base: '#eff1f5', mantle: '#e6e9ef', surface0: '#ccd0da', surface1: '#bcc0cc', text: '#4c4f69', subtext0: '#6c6f85',
        accents: { rosewater: '#dc8a78', flamingo: '#dd7878', pink: '#ea76cb', mauve: '#8839ef', red: '#d20f39', maroon: '#e64553', peach: '#fe640b', yellow: '#df8e1d', green: '#40a02b', teal: '#179299', sky: '#04a5e5', sapphire: '#209fb5', blue: '#1e66f5', lavender: '#7287fd' }
      }
    };

    let currentTheme = localStorage.getItem('catppuccin-theme') || 'mocha';
    let currentAccent = localStorage.getItem('catppuccin-accent') || 'blue';

    function applyPalette() {
      const p = themes[currentTheme] || themes.mocha;
      const root = document.documentElement.style;
      for (const [k, v] of Object.entries(p)) {
        if (k !== 'accents') root.setProperty('--' + k, v);
      }
      root.setProperty('--accent', p.accents[currentAccent] || p.accents.blue);

      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes("'" + currentTheme + "'"));
      });
      document.getElementById('accentSelect').value = currentAccent;
    }

    function setTheme(name) { currentTheme = name; localStorage.setItem('catppuccin-theme', name); applyPalette(); }
    function setAccent(accent) { currentAccent = accent; localStorage.setItem('catppuccin-accent', accent); applyPalette(); }
    applyPalette();
    let duration = 5;
    let clicks = 0;
    let running = false;
    let finished = false;
    let startTime = 0;
    let timerId = null;

    const clickPad = document.getElementById('clickPad');
    const padTitle = document.getElementById('padTitle');
    const padSub = document.getElementById('padSub');
    const timeDisplay = document.getElementById('timeDisplay');
    const clicksDisplay = document.getElementById('clicksDisplay');
    const cpsDisplay = document.getElementById('cpsDisplay');
    const bestDisplay = document.getElementById('bestDisplay');

    function getBestKey() {
      return 'devhub-cps-best-' + duration;
    }

    function loadBest() {
      const saved = parseFloat(localStorage.getItem(getBestKey())) || 0;
      bestDisplay.textContent = saved.toFixed(2);
    }

    function setDuration(sec, btn) {
      duration = sec;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      resetTest();
    }

    function finishTest() {
      running = false;
      finished = true;
      clearInterval(timerId);
      const finalCps = clicks / duration;
      timeDisplay.textContent = '0.0s';
      cpsDisplay.textContent = finalCps.toFixed(2);
      padTitle.textContent = finalCps.toFixed(2) + ' CPS!';
      padSub.textContent = clicks + ' clicks in ' + duration + 's — click Reset Test to go again';

      const prevBest = parseFloat(localStorage.getItem(getBestKey())) || 0;
      if (finalCps > prevBest) {
        localStorage.setItem(getBestKey(), finalCps.toFixed(2));
        bestDisplay.textContent = finalCps.toFixed(2);
        padSub.textContent = 'NEW RECORD! ' + clicks + ' clicks in ' + duration + 's';
      }
    }

    function resetTest() {
      running = false;
      finished = false;
      clicks = 0;
      clearInterval(timerId);
      timeDisplay.textContent = duration.toFixed(1) + 's';
      clicksDisplay.textContent = '0';
      cpsDisplay.textContent = '0.00';
      padTitle.textContent = 'CLICK HERE TO START';
      padSub.textContent = 'Timer starts on your very first click';
      loadBest();
    }

    function clearBest() {
      localStorage.removeItem(getBestKey());
      loadBest();
    }

    clickPad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (finished) return;

      if (!running) {
        running = true;
        startTime = performance.now();
        padTitle.textContent = 'KEEP CLICKING!';
        padSub.textContent = 'Go! Go! Go!';

        timerId = setInterval(() => {
          const elapsed = (performance.now() - startTime) / 1000;
          const left = Math.max(0, duration - elapsed);
          timeDisplay.textContent = left.toFixed(1) + 's';
          if (elapsed > 0) {
            cpsDisplay.textContent = (clicks / elapsed).toFixed(2);
          }
          if (left <= 0) {
            finishTest();
          }
        }, 50);
      }

      clicks++;
      clicksDisplay.textContent = clicks;
    });

    loadBest();
  </script>
</body>
</html>
